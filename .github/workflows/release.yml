name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: Build static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siros-integrity-guard-musl
          path: target/x86_64-unknown-linux-musl/release/siros-integrity-guard

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b
      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package
          path: |
            ../siros-integrity-guard_*.deb
            ../siros-integrity-guard_*.buildinfo
            ../siros-integrity-guard_*.changes

  publish:
    name: Publish to GitHub Releases
    needs: [build-musl, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download musl binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: siros-integrity-guard-musl
          path: artifacts/musl

      - name: Download .deb package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-package
          path: artifacts/deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/musl/siros-integrity-guard
            artifacts/deb/*.deb
          generate_release_notes: true

  publish-apt:
    name: Publish to apt.siros.org
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apt.siros.org package inclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.APT_REPO_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'sirosfoundation',
              repo: 'apt.siros.org',
              workflow_id: 'include-package.yml',
              ref: 'main',
              inputs: {
                run_id: String(context.runId),
                repo: context.repo.owner + '/' + context.repo.repo,
                artifact_name: 'debian-package'
              }
            });
