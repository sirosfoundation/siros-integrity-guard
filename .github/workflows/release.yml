name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: Build static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siros-integrity-guard-musl
          path: target/x86_64-unknown-linux-musl/release/siros-integrity-guard

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build release binary
        run: cargo build --release
      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b
      - name: Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-package
          path: |
            ../siros-integrity-guard_*.deb
            ../siros-integrity-guard_*.buildinfo
            ../siros-integrity-guard_*.changes

  publish:
    name: Publish to GitHub Releases
    needs: [build-musl, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download musl binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: siros-integrity-guard-musl
          path: artifacts/musl

      - name: Download .deb package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debian-package
          path: artifacts/deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/musl/siros-integrity-guard
            artifacts/deb/*.deb
          generate_release_notes: true

  publish-apt:
    name: Publish to apt.siros.org
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apt.siros.org package inclusion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.APT_REPO_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'sirosfoundation',
              repo: 'apt.siros.org',
              workflow_id: 'include-package.yml',
              ref: 'main',
              inputs: {
                run_id: String(context.runId),
                repo: context.repo.owner + '/' + context.repo.repo,
                artifact_name: 'debian-package'
              }
            });
