name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    name: Build static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siros-integrity-guard-musl
          path: target/x86_64-unknown-linux-musl/release/siros-integrity-guard

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Build release binary
        run: cargo build --release
      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b
      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-package
          path: |
            ../siros-integrity-guard_*.deb
            ../siros-integrity-guard_*.buildinfo
            ../siros-integrity-guard_*.changes

  publish:
    name: Publish to GitHub Releases
    needs: [build-musl, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download musl binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: siros-integrity-guard-musl
          path: artifacts/musl

      - name: Download .deb package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-package
          path: artifacts/deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/musl/siros-integrity-guard
            artifacts/deb/*.deb
          generate_release_notes: true

  publish-apt:
    name: Publish to apt.siros.org
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apt.siros.org package inclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.APT_REPO_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'sirosfoundation',
              repo: 'apt.siros.org',
              workflow_id: 'include-package.yml',
              ref: 'main',
              inputs: {
                run_id: String(context.runId),
                repo: context.repo.owner + '/' + context.repo.repo,
                artifact_name: 'debian-package'
              }
            });
