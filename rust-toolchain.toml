# Exact toolchain pin. This file is the single source of truth: rustup uses it
# for every local `cargo`/`rustc`, and CI installs from it through
# .github/actions/rust-toolchain, so a local build and a CI build run the very
# same compiler.
#
# Why exact: a floating `stable` changes the compiler under us on every Rust
# release, so new default lints turn `-D warnings` red without a commit.
#
# This is not the MSRV: `rust-version` in Cargo.toml (if any) is the oldest
# compiler the crate supports.
#
# To bump: change `channel` to the new release (Dependabot's `rust-toolchain`
# ecosystem opens this PR monthly), then run fmt, clippy and tests.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
